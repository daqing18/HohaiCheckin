name: Hohai Daily Check-in

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SINGBOX_VERSION: "1.10.7"
  PROXY_ENDPOINT: "http://127.0.0.1:7890"

on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies & Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m patchright install --with-deps chromium

      - name: Install sing-box
        run: |
          set -euo pipefail
          ver="${SINGBOX_VERSION}"
          arch="linux-amd64"
          url="https://github.com/SagerNet/sing-box/releases/download/v${ver}/sing-box-${ver}-${arch}.tar.gz"
          curl -fsSL "$url" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${ver}-${arch}/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Render sing-box config
        env:
          PROXY_NODES_JSON: ${{ secrets.PROXY_NODES_JSON }}
        run: |
          set -euo pipefail
          python tools/render_singbox.py
          sing-box check -c singbox/config.json

      - name: Start sing-box
        run: |
          set -euo pipefail
          mkdir -p singbox
          nohup sing-box run -c singbox/config.json > singbox/singbox.log 2>&1 &
          echo $! > singbox/sing-box.pid
          disown || true
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/7890) >/dev/null 2>&1; then
              echo "sing-box mixed inbound ready on 127.0.0.1:7890 (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::sing-box did not become ready in 30s"
          tail -n 200 singbox/singbox.log || true
          exit 1

      - name: Health check via proxy
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 25 -x "${PROXY_ENDPOINT}" \
            "https://tv.hohai.eu.org/login" || echo "000")
          echo "Target login page HTTP status via proxy: $code"
          case "$code" in
            2*|3*)
              echo "proxy health check ok"
              ;;
            *)
              echo "::error::proxy health check failed (status=$code)"
              tail -n 200 singbox/singbox.log || true
              exit 1
              ;;
          esac

      - name: Run check-in (with Xvfb virtual display)
        env:
          HOHAI_UN: ${{ secrets.HOHAI_UN }}
          HOHAI_PW: ${{ secrets.HOHAI_PW }}
          HOHAI_TGTK: ${{ secrets.HOHAI_TGTK }}
          HOHAI_TGID: ${{ secrets.HOHAI_TGID }}
          HEADLESS: 'false'
          STRICT_PROXY: 'true'
          HTTP_PROXY_URL: ${{ env.PROXY_ENDPOINT }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x900x24" python checkin.py

      - name: Stop sing-box
        if: always()
        run: |
          if [ -f singbox/sing-box.pid ]; then
            pid="$(cat singbox/sing-box.pid)"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for i in 1 2 3 4 5; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hohai-checkin
          path: |
            artifacts/*.json
            artifacts/*.png
            artifacts/*.html
            singbox/singbox.log
          if-no-files-found: ignore

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          PAGE=1
          DELETED=0
          TOTAL=0
          while true; do
            RAW=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs?per_page=100&page=${PAGE}")

            RUNS=$(echo "$RAW" | jq -r '.workflow_runs[].id' 2>/dev/null)
            if [ -z "$RUNS" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
            for RUN_ID in $RUNS; do
              if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
                echo "⏭️ 跳过当前运行 $RUN_ID"
                continue
              fi
              TOTAL=$((TOTAL + 1))
              echo "🗑️ 删除运行记录: $RUN_ID"
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}")
              if [ "$CODE" = "204" ]; then
                DELETED=$((DELETED + 1))
              else
                echo "  ❌ 删除失败，响应码: $CODE"
              fi
              sleep 0.3
            done
            COUNT=$(echo "$RUNS" | wc -w)
            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done
          echo "📊 共找到 ${TOTAL} 条旧记录，删除 ${DELETED} 条，保留最新 1 条"
